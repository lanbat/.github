name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, and the hardware or platform it runs on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or configuration
      description: Remove IP addresses, domains, keys and secrets first.
      render: shell
